name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Examen-02/VetCare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run Checkstyle
        run: mvn checkstyle:check

  format:
    name: Format Check (Spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Examen-02/VetCare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Check code formatting
        run: mvn spotless:check

  test:
    name: Tests (JUnit + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Examen-02/VetCare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run tests
        run: mvn test
      
      - name: Generate coverage report
        run: mvn jacoco:report
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Examen-02/VetCare/target/site/jacoco/

  build:
    name: Build (Maven)
    runs-on: ubuntu-latest
    needs: [lint, format, test]
    defaults:
      run:
        working-directory: Examen-02/VetCare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build project
        run: mvn clean package -DskipTests
      
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetcare-war
          path: Examen-02/VetCare/target/*.war
