name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Checkstyle
      run: mvn checkstyle:check
      working-directory: ./Examen-02/VetCare

  format:
    name: Format Check (Spotless)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Check code formatting
      run: mvn spotless:check
      working-directory: ./Examen-02/VetCare

  test:
    name: Tests (JUnit + JaCoCo)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run tests
      run: mvn test
      working-directory: ./Examen-02/VetCare
      
    - name: Generate coverage report
      run: mvn jacoco:report
      working-directory: ./Examen-02/VetCare
      
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: Examen-02/VetCare/target/site/jacoco/

  build:
    name: Build (Maven)
    runs-on: ubuntu-latest
    needs: [lint, format, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package -DskipTests
      working-directory: ./Examen-02/VetCare
      
    - name: Upload WAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: vetcare-war
        path: Examen-02/VetCare/target/*.war
